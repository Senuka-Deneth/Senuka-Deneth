<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Senuka Deneth — AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#0f2744"/>
      <stop offset="100%" stop-color="#071220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a5f" stroke-width="0.6" opacity="0.45"/>
    </pattern>
    <style>
      <![CDATA[
        .pulse { animation: pulse 3s ease-in-out infinite; }
        .pulse2 { animation: pulse 2.5s ease-in-out infinite; animation-delay: 0.4s; }
        .pulse3 { animation: pulse 2.8s ease-in-out infinite; animation-delay: 0.8s; }
        .float { animation: floatY 4s ease-in-out infinite; }
        .float2 { animation: floatY 3.6s ease-in-out infinite; animation-delay: 0.6s; }
        .fadeLine { animation: fadeLine 4s ease-in-out infinite; }
        .fadeLine2 { animation: fadeLine 4.5s ease-in-out infinite; animation-delay: 0.5s; }
        .spin { animation: spin 28s linear infinite; transform-origin: 600px 160px; }
        .spinRev { animation: spinRev 18s linear infinite; transform-origin: 600px 160px; }
        .core { animation: corePulse 3s ease-in-out infinite; transform-origin: 600px 160px; }
        .scan { animation: scan 6s linear infinite; }
        .underline { animation: underline 5s ease-in-out infinite; }
        .dot { animation: blink 2s ease-in-out infinite; }

        @keyframes pulse {
          0%, 100% { r: 4; opacity: 0.6; }
          50% { r: 7; opacity: 1; }
        }
        @keyframes floatY {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-10px); }
        }
        @keyframes fadeLine {
          0%, 100% { opacity: 0.2; }
          50% { opacity: 0.5; }
        }
        @keyframes spin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        @keyframes spinRev {
          from { transform: rotate(360deg); }
          to { transform: rotate(0deg); }
        }
        @keyframes corePulse {
          0%, 100% { r: 18; opacity: 0.12; }
          50% { r: 26; opacity: 0.22; }
        }
        @keyframes scan {
          from { transform: translateX(-80px); }
          to { transform: translateX(1200px); }
        }
        @keyframes underline {
          0%, 100% { transform: scaleX(0.55); }
          50% { transform: scaleX(1); }
        }
        @keyframes blink {
          0%, 100% { opacity: 0.7; }
          50% { opacity: 1; }
        }
      ]]>
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="120" fill="url(#glow)"/>

  <g stroke="#22d3ee" stroke-width="1" fill="none">
    <path class="fadeLine" d="M80 80 L180 140 L280 90 L380 160 L480 100"/>
    <path class="fadeLine2" d="M720 70 L820 130 L920 85 L1020 150 L1120 95"/>
    <path class="fadeLine" d="M100 220 L220 180 L340 240 L460 190" style="animation-delay:1s"/>
    <path class="fadeLine2" d="M740 230 L860 190 L980 250 L1100 200" style="animation-delay:1.2s"/>
  </g>

  <g filter="url(#softGlow)">
    <circle class="pulse" cx="180" cy="140" r="5" fill="#14b8a6"/>
    <circle class="pulse2" cx="280" cy="90" r="4" fill="#22d3ee"/>
    <circle class="float" cx="380" cy="160" r="5" fill="#38bdf8"/>
    <circle class="pulse3" cx="820" cy="130" r="5" fill="#14b8a6"/>
    <circle class="pulse" cx="920" cy="85" r="4" fill="#22d3ee"/>
    <circle class="float2" cx="1020" cy="150" r="5" fill="#38bdf8"/>
    <circle class="pulse2" cx="220" cy="180" r="3.5" fill="#67e8f9"/>
    <circle class="pulse3" cx="860" cy="190" r="3.5" fill="#67e8f9"/>
  </g>

  <circle class="spin" cx="600" cy="160" r="78" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.25" stroke-dasharray="8 10"/>
  <circle class="spinRev" cx="600" cy="160" r="58" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.3" stroke-dasharray="4 8"/>
  <circle class="core" cx="600" cy="160" r="22" fill="#0ea5e9"/>
  <circle class="dot" cx="600" cy="160" r="8" fill="#22d3ee" filter="url(#softGlow)"/>

  <text x="600" y="148" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="700" fill="url(#accent)">
    Senuka Deneth
  </text>
  <text x="600" y="188" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" letter-spacing="3" fill="#94a3b8">
    AI ENGINEER  ·  ML SPECIALIST  ·  FULL-STACK
  </text>

  <g transform="translate(600,211)">
    <rect class="underline" x="-180" y="-1" width="360" height="2" rx="1" fill="url(#accent)" opacity="0.7" style="transform-origin: center;"/>
  </g>

  <rect class="scan" x="0" y="0" width="80" height="320" fill="url(#glow)" opacity="0.35"/>
</svg>
