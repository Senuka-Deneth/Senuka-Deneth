<svg xmlns="http://www.w3.org/2000/svg" width="900" height="28" viewBox="0 0 900 28" role="img" aria-label="divider">
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <style>
      <![CDATA[
        .core { animation: pulse 2s ease-in-out infinite; }
        .ring { animation: ring 2s ease-out infinite; }
        @keyframes pulse {
          0%, 100% { r: 4; opacity: 0.6; }
          50% { r: 6; opacity: 1; }
        }
        @keyframes ring {
          0% { r: 7; opacity: 0.5; }
          100% { r: 14; opacity: 0; }
        }
      ]]>
    </style>
  </defs>
  <rect x="40" y="13" width="820" height="2" rx="1" fill="url(#line)"/>
  <circle class="core" cx="450" cy="14" r="5" fill="#22d3ee"/>
  <circle class="ring" cx="450" cy="14" r="9" fill="none" stroke="#14b8a6" stroke-width="1"/>
</svg>
