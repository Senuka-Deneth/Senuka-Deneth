<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" role="img" aria-label="About Senuka">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1728"/>
      <stop offset="100%" stop-color="#0f2438"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <style>
      <![CDATA[
        .cornerA { animation: fade 3s ease-in-out infinite; }
        .cornerB { animation: fade 3s ease-in-out infinite; animation-delay: 1.5s; }
        .live { animation: live 1.5s ease-in-out infinite; }
        .liveRing { animation: liveRing 1.5s ease-out infinite; }
        @keyframes fade {
          0%, 100% { opacity: 0.4; }
          50% { opacity: 1; }
        }
        @keyframes live {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.3; }
        }
        @keyframes liveRing {
          0% { r: 8; opacity: 0.8; }
          100% { r: 16; opacity: 0; }
        }
      ]]>
    </style>
  </defs>

  <rect x="1" y="1" width="818" height="218" rx="16" fill="url(#cardBg)" stroke="url(#border)" stroke-width="2"/>

  <path class="cornerA" d="M24 40 V24 H40" fill="none" stroke="#14b8a6" stroke-width="2" stroke-linecap="round"/>
  <path class="cornerB" d="M796 40 V24 H780" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path class="cornerB" d="M24 180 V196 H40" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path class="cornerA" d="M796 180 V196 H780" fill="none" stroke="#14b8a6" stroke-width="2" stroke-linecap="round"/>

  <text x="48" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">
    Building intelligent systems that ship
  </text>
  <text x="48" y="92" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94a3b8">
    AI undergraduate at University of Moratuwa · focused on agents, LLMs &amp; real products
  </text>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#e2e8f0">
    <rect x="48" y="120" width="110" height="28" rx="8" fill="#134e4a" stroke="#14b8a6" stroke-width="1"/>
    <text x="103" y="138" text-anchor="middle">AI Agents</text>
    <rect x="170" y="120" width="90" height="28" rx="8" fill="#164e63" stroke="#22d3ee" stroke-width="1"/>
    <text x="215" y="138" text-anchor="middle">LLMs</text>
    <rect x="272" y="120" width="90" height="28" rx="8" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1"/>
    <text x="317" y="138" text-anchor="middle">RAG</text>
    <rect x="374" y="120" width="130" height="28" rx="8" fill="#134e4a" stroke="#14b8a6" stroke-width="1"/>
    <text x="439" y="138" text-anchor="middle">Deep Learning</text>
    <rect x="516" y="120" width="140" height="28" rx="8" fill="#164e63" stroke="#22d3ee" stroke-width="1"/>
    <text x="586" y="138" text-anchor="middle">Full-Stack AI</text>
  </g>

  <text x="48" y="180" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#64748b">
    Transforming AI research into products people can use.
  </text>

  <circle class="live" cx="760" cy="170" r="6" fill="#14b8a6"/>
  <circle class="liveRing" cx="760" cy="170" r="12" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
</svg>
